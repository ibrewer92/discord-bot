name: Post readings and saints (manual)

# The daily posts run from a Windows PC (see run_daily.py and
# windows/install-task.ps1). This is a by-hand fallback for a day the PC
# missed. It can't see the PC's markers, so use it only after checking the
# PC didn't post.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date to post (YYYY-MM-DD). Leave blank for today."
        required: false
      post:
        description: "What to post"
        type: choice
        options: [both, readings, saints]
        default: both

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Post readings
        if: inputs.post != 'saints'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATE: ${{ inputs.date }}
        run: python3 post_readings.py --date "$DATE"

      # Runs even if the readings failed, so one bad post doesn't block the other.
      - name: Post saints
        if: ${{ !cancelled() && inputs.post != 'readings' }}
        env:
          DISCORD_SAINTS_WEBHOOK_URL: ${{ secrets.DISCORD_SAINTS_WEBHOOK_URL }}
          DATE: ${{ inputs.date }}
        run: python3 post_saints.py --date "$DATE"
