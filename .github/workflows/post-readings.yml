name: Post daily readings and saints

on:
  schedule:
    # Cron runs in UTC, so these cover 7 AM Central in both daylight saving
    # time (UTC-5) and winter (UTC-6). Runs before 7 AM Central do nothing.
    # GitHub delays scheduled runs under load and sometimes drops them, so
    # after the main 7:05 run there are hourly backups, and each run skips
    # whatever an earlier run already posted that day.
    - cron: "5 12,13 * * *"
    - cron: "35 12-16 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to post (YYYY-MM-DD). Leave blank for today."
        required: false
      post:
        description: "What to post"
        type: choice
        options: [both, readings, saints]
        default: both

permissions:
  contents: read

# One run at a time, so a backup can't post while an earlier run is still posting.
concurrency:
  group: daily-posts
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Decide what to post
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          POST: ${{ inputs.post }}
          DATE: ${{ inputs.date }}
        run: |
          today=$(TZ=America/Chicago date +%F)
          hour=$(TZ=America/Chicago date +%-H)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "schedule" ]; then
            if [ "$hour" -lt 7 ]; then
              echo "It is before 7 AM Central, so there is nothing to do yet."
              exit 0
            fi
            echo "readings=true" >> "$GITHUB_OUTPUT"
            echo "saints=true" >> "$GITHUB_OUTPUT"
            echo "mark=true" >> "$GITHUB_OUTPUT"
          else
            # Runs started by hand always post. When they post today's,
            # they also stop the scheduled runs from posting it again.
            if [ "$POST" != "saints" ]; then
              echo "readings=true" >> "$GITHUB_OUTPUT"
            fi
            if [ "$POST" != "readings" ]; then
              echo "saints=true" >> "$GITHUB_OUTPUT"
            fi
            if [ -z "$DATE" ] || [ "$DATE" = "$today" ]; then
              echo "mark=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Check whether today's readings already posted
        id: readings_done
        if: github.event_name == 'schedule' && steps.plan.outputs.readings == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .posted
          key: posted-readings-${{ steps.plan.outputs.today }}
          lookup-only: true

      - name: Check whether today's saints already posted
        id: saints_done
        if: github.event_name == 'schedule' && steps.plan.outputs.saints == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .posted
          key: posted-saints-${{ steps.plan.outputs.today }}
          lookup-only: true

      - uses: actions/checkout@v4
        if: >-
          (steps.plan.outputs.readings == 'true' && steps.readings_done.outputs.cache-hit != 'true') ||
          (steps.plan.outputs.saints == 'true' && steps.saints_done.outputs.cache-hit != 'true')

      - name: Post readings
        id: post_readings
        if: steps.plan.outputs.readings == 'true' && steps.readings_done.outputs.cache-hit != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DATE: ${{ inputs.date }}
        run: python3 post_readings.py --date "$DATE"

      - name: Prepare readings marker
        if: steps.post_readings.outcome == 'success' && steps.plan.outputs.mark == 'true'
        run: mkdir -p .posted && date -u > .posted/readings

      - name: Record that today's readings posted
        if: steps.post_readings.outcome == 'success' && steps.plan.outputs.mark == 'true'
        uses: actions/cache/save@v4
        with:
          path: .posted
          key: posted-readings-${{ steps.plan.outputs.today }}

      # The saints steps run even if the readings failed, so one bad post
      # doesn't block the other.
      - name: Post saints
        id: post_saints
        if: ${{ !cancelled() && steps.plan.outputs.saints == 'true' && steps.saints_done.outputs.cache-hit != 'true' }}
        env:
          DISCORD_SAINTS_WEBHOOK_URL: ${{ secrets.DISCORD_SAINTS_WEBHOOK_URL }}
          DATE: ${{ inputs.date }}
        run: python3 post_saints.py --date "$DATE"

      - name: Prepare saints marker
        if: ${{ !cancelled() && steps.post_saints.outcome == 'success' && steps.plan.outputs.mark == 'true' }}
        run: mkdir -p .posted && date -u > .posted/saints

      - name: Record that today's saints posted
        if: ${{ !cancelled() && steps.post_saints.outcome == 'success' && steps.plan.outputs.mark == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .posted
          key: posted-saints-${{ steps.plan.outputs.today }}
